# Publishes the public beta to GitHub Pages: https://nattyman.github.io/bravequest-lighthouse/
# Builds dist/ with test/build_release.py (Three.js and fonts bundled, Test tools off, pointed at the save
# service) and deploys only that folder, so the design docs and tests are not on the site.
# Runs on every push to main, after the change has been through a pull request and its checks.
# Three optional repository variables (Settings > Secrets and variables > Actions > Variables) change the build
# without a code change: BQ_API (the save service's address), BQ_DIRECT (the game's own address) and
# BQ_ACCOUNTS (set to "on" to build with accounts: sign-in, save slots). Unset, the build is the guest-only beta.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the beta
        run: >-
          python3 test/build_release.py
          --api ${{ vars.BQ_API || 'https://bravequest-api.saturnsites.com' }}
          --direct ${{ vars.BQ_DIRECT || 'https://nattyman.github.io/bravequest-lighthouse/' }}
          ${{ vars.BQ_ACCOUNTS == 'on' && '--accounts' || '' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
